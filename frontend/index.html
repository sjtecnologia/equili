<!doctype html>
<html lang="pt-BR" style="background:#fff">
  <head>
    <meta charset="UTF-8" />

    <!-- Força WKWebView iOS a nunca cachear este arquivo -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Ícone e PWA básico -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />

    <!-- Viewport e tema -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D5E" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Equili" />

    <!-- Descrição e meta social -->
    <meta name="description" content="Equili — Controle financeiro familiar com IA. Saia das dívidas com um plano feito para você." />
    <meta property="og:title" content="Equili" />
    <meta property="og:description" content="Controle financeiro familiar com IA. Saia das dívidas com um plano feito para você." />
    <meta property="og:type" content="website" />

    <title>Equili</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
