server {
    listen 80;
    server_name equili.com.br www.equili.com.br;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://models.inference.ai.azure.com https://api.resend.com;" always;

    # Bloqueia arquivos sensíveis e metadados do repositório.
    location ~ (^|/)\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(env|log|sql|sqlite|sqlite3|bak|old)$ {
        deny all;
        return 404;
    }

    location ~* (^|/)(\.git|database_dump\.sql) {
        deny all;
        return 404;
    }

    # Roteamento SPA — todas as rotas retornam index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html e service worker NUNCA em cache (sempre busca versão nova)
    location ~* (index\.html|sw\.js|workbox-.*)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy para o backend
    location /api/ {
        proxy_pass http://equili_backend_equili:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Cache para assets estáticos com hash no nome (imutáveis)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
