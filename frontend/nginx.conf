server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Roteamento SPA — todas as rotas retornam index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html e service worker NUNCA em cache (sempre busca versão nova)
    location ~* (index\.html|sw\.js|workbox-.*)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy para o backend (prefixo /backend/ evita conflito com nginx do host)
    location /backend/ {
        rewrite ^/backend/(.*)$ /api/$1 break;
        proxy_pass http://equili_backend_equili:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para assets estáticos com hash no nome (imutáveis)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
